; ESP32 receiver. Copy src/secrets.example.h to src/secrets.h first.
;
; Build & flash:  pio run -t upload && pio device monitor
; Loopback test:  pio run -e loopback -t upload   (jumper GPIO5 -> GPIO4)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@^2.8
build_flags = -I${PROJECT_DIR}/../common

; Sends a fake sensor packet (node 250) every 30 s on GPIO5.
[env:loopback]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DLOOPBACK_TEST
