<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 580" width="930" height="580" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Sensor node schematic</title>
  <rect width="930" height="580" rx="8" fill="#ffffff"/>

  <g stroke="#1f2328" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- BT1 + SW1 -->
    <path d="M78 60h24M90 60v40"/>
    <circle cx="90" cy="103" r="3"/>
    <circle cx="90" cy="147" r="3"/>
    <path d="M90 144l18-36"/>
    <path d="M90 150v50"/>
    <path d="M72 200h36M82 210h16"/>
    <path d="M90 210v20"/>
    <path d="M72 230h36M82 240h16"/>
    <path d="M90 240v60"/>
    <path d="M78 300h24M82 305h16M86 310h8"/>

    <!-- C1 -->
    <path d="M188 150h24M200 150v150"/>
    <path d="M184 300h32M184 310h32"/>
    <path d="M200 310v70"/>
    <path d="M188 380h24M192 385h16M196 390h8"/>

    <!-- C2 -->
    <path d="M278 150h24M290 150v150"/>
    <path d="M274 300h32M274 310h32"/>
    <path d="M290 310v70"/>
    <path d="M278 380h24M282 385h16M286 390h8"/>

    <!-- U1 ATtiny85 -->
    <rect x="400" y="190" width="140" height="180"/>
    <path d="M370 215h30M370 260h30M370 305h30M370 350h30"/>
    <path d="M540 215h30M540 260h30M540 305h30M540 350h30"/>
    <!-- pin 2/3 no-connect -->
    <path d="M364 254l12 12M364 266l12-12M364 299l12 12M364 311l12-12"/>
    <!-- pin 4 GND -->
    <path d="M370 350v50M358 400h24M362 405h16M366 410h8"/>
    <!-- pin 8 VCC -->
    <path d="M570 215v-65M558 150h24"/>

    <!-- SCL -->
    <path d="M570 260h150"/>
    <!-- DATA -->
    <path d="M570 305h40v175h110"/>
    <!-- SDA, hopping over DATA -->
    <path d="M570 350h34a6 6 0 0 1 12 0h104"/>

    <!-- U2 SHT40 -->
    <rect x="720" y="230" width="120" height="150"/>
    <path d="M780 230v-30M768 200h24"/>
    <path d="M780 380v20M768 400h24M772 405h16M776 410h8"/>

    <!-- U3 STX882 -->
    <rect x="720" y="440" width="120" height="90"/>
    <path d="M720 455h-30v-25M678 430h24"/>
    <path d="M720 505h-30v20M678 525h24M682 530h16M686 535h8"/>
    <path d="M840 470h55v-45"/>
    <path d="M895 425v-30M895 408l-12-16M895 408l12-16"/>

    <!-- J1 ISP header -->
    <rect x="40" y="445" width="310" height="105" stroke-dasharray="5 4" stroke="#57606a"/>
    <rect x="198" y="458" width="60" height="76" rx="3"/>
    <circle cx="213" cy="472" r="5"/><circle cx="243" cy="472" r="5"/>
    <circle cx="213" cy="496" r="5"/><circle cx="243" cy="496" r="5"/>
    <circle cx="213" cy="520" r="5"/><circle cx="243" cy="520" r="5"/>
  </g>

  <g fill="#1f2328">
    <!-- power labels -->
    <text x="90" y="54" text-anchor="middle">VCC</text>
    <text x="200" y="144" text-anchor="middle">VCC</text>
    <text x="290" y="144" text-anchor="middle">VCC</text>
    <text x="570" y="144" text-anchor="middle">VCC</text>
    <text x="780" y="194" text-anchor="middle">VCC</text>
    <text x="690" y="424" text-anchor="middle">VCC</text>

    <!-- reference designators -->
    <text x="114" y="122" font-weight="bold">SW1</text>
    <text x="114" y="138" fill="#57606a" font-size="11">holder switch</text>
    <text x="114" y="214" font-weight="bold">BT1</text>
    <text x="114" y="230">2×AA</text>
    <text x="114" y="246">3 V</text>
    <text x="58" y="198" font-size="15">+</text>

    <text x="222" y="300" font-weight="bold">C1</text>
    <text x="222" y="316">10 µF</text>
    <text x="312" y="300" font-weight="bold">C2</text>
    <text x="312" y="316">100 nF</text>
    <text x="312" y="332" fill="#57606a" font-size="11">next to U1</text>

    <text x="470" y="180" text-anchor="middle" font-weight="bold">U1  ATtiny85</text>
    <text x="408" y="219">PB5/RESET</text>
    <text x="408" y="264">PB3</text>
    <text x="408" y="309">PB4</text>
    <text x="408" y="354">GND</text>
    <text x="532" y="219" text-anchor="end">VCC</text>
    <text x="532" y="264" text-anchor="end">PB2</text>
    <text x="532" y="309" text-anchor="end">PB1</text>
    <text x="532" y="354" text-anchor="end">PB0</text>
    <g fill="#57606a" font-size="11">
      <text x="385" y="210" text-anchor="middle">1</text>
      <text x="385" y="255" text-anchor="middle">2</text>
      <text x="385" y="300" text-anchor="middle">3</text>
      <text x="385" y="345" text-anchor="middle">4</text>
      <text x="555" y="210" text-anchor="middle">8</text>
      <text x="555" y="255" text-anchor="middle">7</text>
      <text x="555" y="300" text-anchor="middle">6</text>
      <text x="555" y="345" text-anchor="middle">5</text>
    </g>

    <text x="780" y="248" text-anchor="middle">VIN</text>
    <text x="728" y="264">SCL</text>
    <text x="728" y="354">SDA</text>
    <text x="780" y="372" text-anchor="middle">GND</text>
    <text x="850" y="250" font-weight="bold">U2</text>
    <text x="850" y="266">SHT40 or</text>
    <text x="850" y="282">GY-21</text>
    <g fill="#57606a" font-size="11">
      <text x="850" y="306">I²C</text>
      <text x="850" y="320">pull-ups</text>
      <text x="850" y="334">on board</text>
    </g>

    <text x="728" y="459">VCC</text>
    <text x="728" y="484">DATA</text>
    <text x="728" y="509">GND</text>
    <text x="832" y="474" text-anchor="end">ANT</text>
    <text x="780" y="550" text-anchor="middle" font-weight="bold">U3  STX882 433 MHz TX</text>
    <text x="886" y="436" text-anchor="end" fill="#57606a" font-size="11">17.3 cm wire</text>

    <text x="50" y="465" font-weight="bold">J1</text>
    <text x="50" y="481" fill="#57606a" font-size="11">ISP header</text>
    <text x="50" y="495" fill="#57606a" font-size="11">(optional)</text>
    <g font-size="11">
      <text x="190" y="476" text-anchor="end"><tspan fill="#0969da">PB1</tspan> MISO 1</text>
      <text x="190" y="500" text-anchor="end"><tspan fill="#0969da">PB2</tspan> SCK 3</text>
      <text x="190" y="524" text-anchor="end"><tspan fill="#0969da">RESET</tspan> 5</text>
      <text x="266" y="476">2 VCC</text>
      <text x="266" y="500">4 MOSI <tspan fill="#0969da">PB0</tspan></text>
      <text x="266" y="524">6 GND</text>
    </g>
  </g>

  <!-- net labels -->
  <g fill="#0969da" font-size="12">
    <text x="364" y="211" text-anchor="end">RESET</text>
    <text x="640" y="254">SCL</text>
    <text x="640" y="344">SDA</text>
    <text x="640" y="474">DATA</text>
  </g>
</svg>
