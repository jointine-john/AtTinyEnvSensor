    <text x="190" y="586" text-anchor="middle" font-weight="bold">J1  ISP 2×3, 2.54 mm</text>
    <text x="190" y="602" text-anchor="middle" fill="#57606a" font-size="11">or pogo-pin pads</text>
    <text x="384" y="446" font-size="12">• Same pin-out as the stripboard build: the sht40 firmware runs unchanged.</text>
    <text x="384" y="465" font-size="12">• No regulator: everything runs from the cell (3.0 V fresh → ~2.0 V).</text>
    <text x="384" y="484" font-size="12">• † C3 value set by the coin-cell bench test (220–470 µF). Must be</text>
    <text x="396" y="503" font-size="12">low-leakage (polymer or low-leakage electrolytic). Place near U3.</text>
    <text x="384" y="522" font-size="12">• C1 at U1 pin 8 and C4 at U2 VDD, as close to the pins as possible.</text>
    <text x="384" y="541" font-size="12">• R1/R2 replace the I²C pull-ups the breakout boards used to provide.</text>
    <text x="384" y="560" font-size="12">• ISP shares SDA/SCL/DATA, so U3 chirps during upload (harmless).</text>
    <text x="384" y="579" font-size="12">• Keep U2 at a board edge away from U3; slot the PCB around it.</text>
    <text x="384" y="598" font-size="12">• Same-name blue labels are connected. All VCC/GND symbols are BT1.</text>
  </g>
