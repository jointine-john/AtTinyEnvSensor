<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Receiver schematic</title>
  <rect width="620" height="250" rx="8" fill="#ffffff"/>

  <g stroke="#1f2328" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- U1 ESP32 -->
    <rect x="60" y="60" width="160" height="140"/>
    <!-- U2 RXB6 -->
    <rect x="400" y="60" width="140" height="140"/>
    <!-- wires -->
    <path d="M220 90h180M220 130h180M220 170h180"/>
    <!-- antenna -->
    <path d="M470 60v-25M470 45l-12-16M470 45l12-16"/>
  </g>

  <g fill="#1f2328">
    <text x="212" y="94" text-anchor="end">3V3</text>
    <text x="212" y="134" text-anchor="end">GPIO4</text>
    <text x="212" y="174" text-anchor="end">GND</text>
    <text x="140" y="222" text-anchor="middle" font-weight="bold">U1  ESP32 dev board</text>

    <text x="408" y="94">VCC</text>
    <text x="408" y="134">DATA</text>
    <text x="408" y="174">GND</text>
    <text x="470" y="80" text-anchor="middle">ANT</text>
    <text x="470" y="222" text-anchor="middle" font-weight="bold">U2  RXB6 433 MHz RX</text>
    <text x="488" y="40" fill="#57606a" font-size="11">17.3 cm wire</text>
    <text x="408" y="150" fill="#57606a" font-size="11">(either DATA pin)</text>
  </g>

  <g fill="#0969da" font-size="12">
    <text x="310" y="84" text-anchor="middle">3V3</text>
    <text x="310" y="124" text-anchor="middle">RX_DATA</text>
    <text x="310" y="164" text-anchor="middle">GND</text>
  </g>
</svg>
