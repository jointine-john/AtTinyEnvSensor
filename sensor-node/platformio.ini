; ATtiny85 sensor node.
;
; Build & flash:   pio run -t upload
; Different node:  PLATFORMIO_BUILD_FLAGS="-DNODE_ID=2" pio run -t upload
; Set fuses (new chip, once):  pio run -t fuses

[env:attiny85]
platform = atmelavr
board = attiny85
board_build.f_cpu = 1000000L
build_flags =
    -I${PROJECT_DIR}/../common
    -DINTERVAL_S=300

; 8 MHz internal RC with CKDIV8 (firmware sets the prescaler itself anyway),
; brown-out detector disabled (saves ~20 uA), ISP enabled.
board_fuses.lfuse = 0x62
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; USBasp programmer. For an Arduino running "ArduinoISP" replace the two
; lines below with (see docs/programming.md):
;   upload_protocol = stk500v1
;   upload_port = /dev/ttyACM0
;   upload_speed = 19200
;   upload_flags =
;       -P$UPLOAD_PORT
;       -b$UPLOAD_SPEED
upload_protocol = usbasp
upload_flags = -B 32
